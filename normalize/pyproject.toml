[project]
name = "voxstage-normalize"
version = "0.0.1"
description = "Spoken numbers, days, dates and times to exact values, English and Korean (inverse text normalisation)"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["voxstage_normalize*"]
