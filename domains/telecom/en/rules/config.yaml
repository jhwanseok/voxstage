# Counts and actions only; the words are in ../notices.yaml (R5).
# What happens when no FAQ rule matches. After max_misses consecutive misses the call is handed off
# (on_exceed: handoff) or ended (on_exceed: end_call). A match resets the counter.
fallback:
  max_misses: 3
  on_exceed: handoff

# Unusable answer at an ask: re-prompt up to max_reprompts times, then hand off (or end the call).
ask:
  max_reprompts: 2
  on_exceed: handoff

# A switch to another flow sets the running one aside (R6); at most max_parked are kept, the oldest is dropped (R7-3).
switch:
  max_parked: 2

# Corrections of one read-back slot before the caller is handed off (R9-3).
correction:
  max_corrections: 2
  on_exceed: handoff

# Failed identity checks before the call is locked and handed off (R13-2); a flow may set its own
# `verification: {max_attempts: N}`.
verification:
  max_attempts: 3
  on_exceed: handoff
