# Move the billing day (R11-3): the day of the month and the month it starts, read from spoken words, a yes first.
id: change_bill_date
triggers: {all_of: [[bill, billing]], any_of: [date, day, move, change], none_of: [how, when, pay, much]}
captures: {bill_day: {extractor: day}, effective_from: {extractor: month_start}}
start: ask_day
nodes:
  ask_day: {type: ask, slot: bill_day, prompt: "Which day of the month would you like to be billed?", extractor: day, next: ask_from}
  ask_from: {type: ask, slot: effective_from, prompt: "From which month?", extractor: month_start, next: confirm}
  confirm: {type: confirm, prompt: "Shall I move your billing day to day {bill_day} of the month, starting {effective_from | date}?", on_yes: change, on_no: done}
  change: {type: call, tool: change_bill_date, args: {bill_day: "{bill_day}", effective_from: "{effective_from}"}, on_ok: say_done, on_error: say_fail}
  say_done: {type: say, text: "Done. From {effective_from | date} you will be billed on day {bill_day} of each month.", next: done}
  say_fail: {type: say, text: "I'm unable to change the billing day right now. Please try again later.", next: done}
  done: {type: end}
