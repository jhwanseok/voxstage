id: telecom.C11.001
lang: en
domain: telecom
capability: C11
title: "Billing details are withheld until the PIN check passes, then released"
tags: [verification, gate]
setup:
  customer: {account_last4: "5580"}
turns:
  - user: {kind: utterance, text: What is my current bill}
    expect:
      tool_calls: []
      reply_contains_any: [verify, PIN]
  - user: {kind: dtmf, digits: "1357"}
    expect:
      tool_calls:
        - {name: verify_identity, args: {account_last4: "5580", pin: "1357"}}
        - {name: get_bill, args: {account_last4: "5580"}}
      reply_contains_any: ["$45", forty five dollars]
