id: telecom.C08.001
lang: en
domain: telecom
capability: C08
title: "Contract type (attribute) plus API result gives the plan price (yearly: 20 dollars)"
tags: [attribute, api]
setup:
  customer: {contract: yearly}
turns:
  - user: {kind: utterance, text: How much is the plus plan}
    expect:
      tool_calls:
        - {name: get_plan_price, args: {plan: plus, contract: yearly}}
      reply_contains_any: ["$20", twenty dollars]
