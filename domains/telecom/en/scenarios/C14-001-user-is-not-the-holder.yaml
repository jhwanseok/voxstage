id: telecom.C14.001
lang: en
domain: telecom
capability: C14
title: "The line user is not the account holder: the user's number goes to the API"
tags: [roles, binding]
turns:
  - user: {kind: utterance, text: I want to register a family member on my plan}
    expect:
      flow: line_user_registration
      reply_contains_any: [phone]
  - user: {kind: dtmf, digits: "5580"}
    expect:
      slots: {holder.phone_last4: "5580"}
      reply_contains_any: [used by you]
  - user: {kind: utterance, text: "No"}
    expect:
      tool_calls: []
      reply_contains_any: [use the line]
  - user: {kind: dtmf, digits: "7310"}
    expect:
      tool_calls:
        - {name: register_line_user, args: {holder_phone: "5580", user_phone: "7310"}}
      reply_contains: ["7310", LU3001]
