id: telecom.C08.001
lang: ko
domain: telecom
capability: C08
title: "약정 유형(속성)과 API 결과로 요금제 가격이 정해진다 (연 약정 20달러)"
tags: [attribute, api]
setup:
  customer: {contract: yearly}
turns:
  - user: {kind: utterance, text: 플러스 요금제는 얼마예요}
    expect:
      tool_calls:
        - {name: get_plan_price, args: {plan: plus, contract: yearly}}
      reply_contains_any: [20달러, 이십 달러]
