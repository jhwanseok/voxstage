# 요금제, 그다음 올리기/낮추기(R7-8). 고지문은 낮추는 경우에만. 둘 다 첫 말에서 받을 수 있다. 영어 쌍둥이와 노드 구조가 같다.
id: change_plan
triggers: {all_of: [[요금제, 요금], [낮추, 내리, 올리, 다운그레이드, 업그레이드, 변경, 바꾸]], none_of: [어떻, 방법, 얼마, 가격]}
captures: {plan: {extractor: choice, choices: {베이직: basic, 기본: basic, 플러스: plus}}, direction: {extractor: choice, choices: {낮추: downgrade, 내리: downgrade, 다운그레이드: downgrade, 올리: upgrade, 업그레이드: upgrade}}}
start: ask_plan
nodes:
  ask_plan: {type: ask, slot: plan, prompt: "어느 요금제로 바꾸시나요? 베이직 또는 플러스라고 말씀해 주세요.", extractor: choice, choices: {베이직: basic, 기본: basic, 플러스: plus}, next: ask_direction}
  ask_direction: {type: ask, slot: direction, prompt: "요금제를 올리시나요, 낮추시나요?", extractor: choice, choices: {낮추: downgrade, 내리: downgrade, 다운그레이드: downgrade, 올리: upgrade, 업그레이드: upgrade}, next: intro}
  intro: {type: say, text: "요금제 변경을 도와드릴게요.", next: notice}
  notice: {type: notices, next: done}
  done: {type: end}
