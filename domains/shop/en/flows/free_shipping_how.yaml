# Policy value spoken from the request's policy (R14).
id: free_shipping_how
triggers: {all_of: [[free], [shipping, delivery]], any_of: [how, get, qualify], none_of: [minimum, least, threshold, much], priority: 1}
start: say_it
nodes:
  say_it: {type: say, text: "Add items until your order reaches {policy.free_shipping_threshold | money('USD')}, and shipping is free.", next: done}
  done: {type: end}
