# Fake backend API for the shop domain. Answers depend only on the arguments (see docs/decisions/0004).
# Language-independent, so it is shared by every language of the domain.
tools:
  get_order_status:
    retry: 1                    # a timeout is tried once more (R12-1)
    requires: verified          # caller must pass verify_identity first (R13-1)
    params: [order_id]
    rules:
      - when: {order_id: "9999"}
        error: timeout            # used by the API-failure case (C10)
      - when: {order_id: "1001"}
        return: {status: shipped, eta: "2026-10-08"}
      - when: {order_id: "1002"}
        return: {status: processing, eta: "2026-10-10"}
      - when: {order_id: "1003"}
        return: {status: delivered, eta: "2026-10-01"}
    default:
      error: not_found
  get_shipping_fee:
    retry: 1                    # a timeout is tried once more (R12-1)
    params: [tier]
    rules:
      - when: {tier: gold}
        return: {fee: 0, currency: USD}
      - when: {tier: basic}
        return: {fee: 6, currency: USD}
    default:
      error: not_found
  update_address:
    params: [order_id, address]
    risky: true           # changes the order: a flow must confirm before calling it (R7-12, R8-6)
    rules: []
    default:
      return: {status: updated}
  schedule_delivery:
    params: [quantity, delivery_date, delivery_window]
    risky: true           # books a delivery: confirm first (R7-12, R11-3)
    rules: []
    default:
      return: {status: scheduled}
  update_quantity:
    params: [order_id, quantity]
    risky: true           # changes the order: confirm first (R7-12, R9-4)
    rules: []
    default:
      return: {status: updated}
  create_return:
    params: [order_id, item, size]
    risky: true           # opens a return: confirm first (R7-12, R10-6)
    rules: []
    default:
      return: {reference: RT1001}
  verify_identity:
    verifies: true
    params: [order_id, zip_code]
    rules:
      - when: {order_id: "1001", zip_code: "12345"}
        return: {verified: true}
      - when: {order_id: "9999", zip_code: "12345"}
        return: {verified: true}   # passes, so the C10 timeout comes after the check (R13-3)
    default:
      error: invalid_credentials
  authorize_pickup:
    params: [orderer_phone, picker_phone]
    rules: []
    default:
      return: {reference: PK2001}
