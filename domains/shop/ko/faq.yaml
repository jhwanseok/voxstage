# Synthetic FAQ for a fictional online shop (Korean). Written from scratch for this project.
# `answer` is the verbatim reply. `asr_variants` are hand-written plausible recognition errors.
lang: ko
entries:
  - id: shop.faq.shipping_time
    question: "배송은 얼마나 걸려요"
    answer: "일반 배송은 영업일 기준 3일에서 5일, 빠른 배송은 영업일 기준 1일에서 2일 걸립니다."
    paraphrases: ["주문하면 언제쯤 도착해요", "택배 며칠 만에 와요", "배송 기간이 어떻게 되나요"]
    asr_variants: ["베송은 얼마나 걸려요", "배송은 얼마나 걸려여", "배 송은 얼마나 걸려요"]
  - id: shop.faq.return_how
    question: "물건 반품은 어떻게 해요"
    answer: "앱의 주문 내역에서 반품을 신청하고, 선불 반품 라벨을 출력해서 가까운 택배 접수처에 맡겨 주세요."
    paraphrases: ["산 걸 다시 보내고 싶은데요", "반품 절차가 어떻게 되나요", "구매한 상품을 돌려보내려면 어떻게 해야 돼요"]
    asr_variants: ["물건 반푼은 어떻게 해요", "물건 반 품은 어띃게 해요"]
  - id: shop.faq.track_order
    question: "주문한 상품 배송 조회는 어떻게 해요"
    answer: "앱의 주문 내역에서 해당 주문을 선택하면 배송 상태를 확인할 수 있고, 주문 확인 메일의 배송 조회 링크로도 볼 수 있습니다."
    paraphrases: ["내 택배 지금 어디쯤이에요", "주문한 게 어디까지 왔는지 보려면요", "송장번호 알 수 있나요"]
    asr_variants: ["주문한 상품 베송 조회는 어떻게 해요", "주문한 상품 배송조회는 어떡게해요"]
  - id: shop.faq.change_address
    question: "배송지를 바꿀 수 있나요"
    answer: "상품이 발송되기 전까지는 앱의 주문 내역에서 배송지를 변경할 수 있습니다."
    paraphrases: ["주소를 잘못 적었어요", "받는 곳을 수정하려면 어떻게 하죠", "다른 곳으로 보내 달라고 할 수 있어요"]
    asr_variants: ["배송지를 바꿀수 있나여", "배송지를 받꿀 수 있나요", "베송지를 바꿀 수 있나요"]
  - id: shop.faq.payment_methods
    question: "결제 수단은 뭐가 가능해요"
    answer: "신용카드와 체크카드, 기프트카드, 그리고 지역에서 사용할 수 있는 간편 결제를 지원합니다."
    paraphrases: ["기프트카드로 결제해도 돼요", "어떤 카드 받아요", "주문 결제는 어떻게 하면 돼요"]
    asr_variants: ["결재 수단은 뭐가 가능해요", "결제 수다는 뭐가 가능해여"]
  - id: shop.faq.gift_wrap
    question: "선물 포장도 해 주나요"
    answer: "결제 단계에서 소정의 비용으로 선물 포장을 선택할 수 있고, 손글씨 메시지도 넣을 수 있습니다."
    paraphrases: ["선물용으로 포장해 줄 수 있어요", "선물 메시지 같이 넣고 싶은데요", "선물 옵션 같은 거 있어요"]
    asr_variants: ["선물 포장도 해주나여", "선물 포장도 해 주나", "선물 퐁장도 해 주나요"]
  - id: shop.faq.cancel_order
    question: "주문은 어떻게 취소해요"
    answer: "아직 발송 전이라면 앱의 주문 내역에서 직접 주문을 취소할 수 있습니다."
    paraphrases: ["산 거 취소하고 싶어요", "주문을 멈출 수 있나요", "방금 결제한 거 어떻게 취소하죠"]
    asr_variants: ["주문은 어띃게 취소해요", "주문은 어떻게 취소혜요", "주 문은 어떻게 추소해요"]
  - id: shop.faq.use_coupon
    question: "쿠폰 코드는 어떻게 써요"
    answer: "결제 화면의 프로모션 입력란에 쿠폰 코드를 넣으면 결제 전에 할인이 적용된 금액이 보입니다."
    paraphrases: ["할인 코드는 어디에 넣어요", "프로모션 코드가 안 먹혀요", "할인 쿠폰 적용은 어떻게 해요"]
    asr_variants: ["쿠폰 코드는 어떻게 써여", "쿠뽕 코드는 어떻게 써요", "쿠폰 코도는 어떻게 써요"]
