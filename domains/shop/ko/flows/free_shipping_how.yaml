# 정책 값을 요청의 policy에서 읽어 말한다 (R14). 영어 쌍둥이와 노드 구조가 같다.
id: free_shipping_how
triggers: {all_of: [[무료], [배송]], any_of: [어떻, 방법, 받], none_of: [얼마, 이상, 최소], priority: 1}
start: say_it
nodes:
  say_it: {type: say, text: "주문 금액이 {policy.free_shipping_threshold | money('USD')}이 되도록 담으시면 배송이 무료입니다.", next: done}
  done: {type: end}
