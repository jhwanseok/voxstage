# 정책 값을 요청의 policy에서 읽어 말한다 (R14). 영어 쌍둥이와 노드 구조가 같다.
id: free_shipping
triggers: {all_of: [[배송비, 배송], [안, 무료]], any_of: [얼마, 이상, 최소], priority: 1}
start: say_it
nodes:
  say_it: {type: say, text: "{policy.free_shipping_threshold | money('USD')} 이상 주문하면 배송비가 무료입니다.", next: done}
  done: {type: end}
