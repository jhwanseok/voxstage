id: shop.C11.002
lang: ko
domain: shop
capability: C11
title: "우편번호가 틀리면 주문 정보는 계속 잠겨 있다"
tags: [verification, gate, negative]
setup:
  customer: {order_id: "1001"}
turns:
  - user: {kind: utterance, text: "제 주문 어디쯤 왔어요"}
    expect:
      tool_calls: []
  - user: {kind: dtmf, digits: "99999"}
    expect:
      tool_calls:
        - {name: verify_identity, args: {order_id: "1001", zip_code: "99999"}, error: invalid_credentials}
      reply_contains_any: ["일치하지", "다시 입력", "확인하지 못"]
      reply_not_contains: ["배송 중", "배송 완료", "준비 중"]
