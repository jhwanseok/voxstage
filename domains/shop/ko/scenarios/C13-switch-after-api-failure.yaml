id: shop.C13.004
lang: ko
domain: shop
capability: C13
title: "주문 조회가 실패한 뒤 반품을 시작하고 더 이상 호출하지 않는다"
tags: [interaction, R12xR6]
turns:
  - user: {kind: button, button_id: menu_track}
    expect:
      flow: order_status
  - user: {kind: dtmf, digits: "9999"}
    expect:
      tool_calls: []
      reply_contains_any: [우편번호]
  - user: {kind: dtmf, digits: "12345"}
    expect:
      tool_calls:
        - {name: verify_identity, args: {order_id: "9999", zip_code: "12345"}}
        - {name: get_order_status, args: {order_id: "9999"}, error: timeout}
        - {name: get_order_status, args: {order_id: "9999"}, error: timeout}
      reply_contains_any: ["다시 시도", "확인할 수 없", "조회하지 못"]
  - user: {kind: utterance, text: 그럼 노트북 반품할게요}
    expect:
      flow: return_request
      tool_calls: []
      reply_contains_any: [주문번호]
