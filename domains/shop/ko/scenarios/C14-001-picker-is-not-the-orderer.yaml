id: shop.C14.001
lang: ko
domain: shop
capability: C14
title: "주문을 수령하는 분이 주문자와 다르면 API에는 수령인의 번호가 간다"
tags: [roles, binding]
turns:
  - user: {kind: utterance, text: 친구가 대신 주문을 수령할 거예요}
    expect:
      flow: pickup_authorization
      reply_contains_any: [휴대폰]
  - user: {kind: dtmf, digits: "5580"}
    expect:
      slots: {orderer.phone_last4: "5580"}
      reply_contains_any: [수령]
  - user: {kind: utterance, text: 아니요}
    expect:
      tool_calls: []
      reply_contains_any: [수령하실 분]
  - user: {kind: dtmf, digits: "7310"}
    expect:
      tool_calls:
        - {name: authorize_pickup, args: {orderer_phone: "5580", picker_phone: "7310"}}
      reply_contains: ["7310", PK2001]
