# Synthetic FAQ for a fictional bank. Written from scratch for this project.
# `answer` is the verbatim reply. `asr_variants` are hand-written plausible recognition errors
# (spacing, similar sounds); they are NOT real ASR output. Real noise comes in audio mode later.
entries:
  - id: bank.faq.hours
    question: 영업시간이 어떻게 되나요
    answer: 영업점은 평일 오전 9시부터 오후 4시까지 운영하고, 주말과 공휴일에는 쉽니다.
    paraphrases: [은행 몇 시까지 해요, 지점 문 여는 시간 알려주세요, 주말에는 영업 안 하나요]
    asr_variants: [영업 시간이 어떻게 되나여, 영업시안이 어떻게 되나요]
  - id: bank.faq.card_loss
    question: 체크카드를 분실하면 어떻게 하나요
    answer: 분실 신고는 앱이나 고객센터에서 바로 하실 수 있고, 신고하면 즉시 카드 사용이 정지됩니다.
    paraphrases: [카드를 잃어버렸어요 어떻게 해야 해요, 체크카드 분실했는데 정지는 어떻게 하죠, 카드 잃어버려서 막고 싶어요]
    asr_variants: [체크 카드를 이러버렸어요 어떻게 해요, 체크카드 분신했는데 정지는 어떻게 하죠]
  - id: bank.faq.transfer_limit
    question: 이체 한도는 얼마인가요
    answer: 이체 한도는 상품과 인증 수단에 따라 다르며, 앱의 한도 조회 메뉴에서 확인하고 변경하실 수 있습니다.
    paraphrases: [하루에 얼마까지 보낼 수 있어요, 이체 한도 올리고 싶은데요, 보낼 수 있는 금액에 제한이 있나요]
    asr_variants: [이체 한도가 얼마에요, 이체 한도 가 얼마나 되죠]
  - id: bank.faq.password_locked
    question: 비밀번호를 여러 번 틀려서 잠겼어요
    answer: 비밀번호 오류로 잠긴 경우에는 본인 확인을 거쳐 앱에서 초기화하실 수 있습니다.
    paraphrases: [비밀번호 틀려서 로그인이 안 돼요, 인터넷뱅킹 비밀번호 잠금 풀고 싶어요, 비번 잘못 눌러서 막혔어요]
    asr_variants: [비밀 번호를 여러 번 틀려서 잠겼어여, 비밀번호 잠견어요 어떻게 풀어요]
  - id: bank.faq.passbook_reissue
    question: 통장을 잃어버렸는데 재발급은 어떻게 하나요
    answer: 통장을 분실하셨다면 신분증을 가지고 영업점을 방문하시면 재발급이 가능합니다.
    paraphrases: [통장 분실했어요 새로 만들 수 있나요, 통장 재발급 준비물이 뭐예요, 통장 잃어버렸는데 어디서 다시 받아요]
    asr_variants: [통장을 이러버렸는데 재발급은 어떻게 하나여, 통장 재 발급 준비물이 뭐에요]
  - id: bank.faq.autopay_change
    question: 자동이체를 변경하거나 해지하고 싶어요
    answer: 자동이체는 앱의 자동이체 메뉴에서 금액과 날짜를 바꾸거나 해지하실 수 있습니다.
    paraphrases: [자동이체 금액을 바꾸려면 어떻게 해요, 자동이체 끊고 싶어요, 자동이체 날짜 변경 방법 알려주세요]
    asr_variants: [자동 이체를 변경하거나 해지하고 시퍼요, 자동이체 금액을 바꾸려면 어떡게 해요]
  - id: bank.faq.overseas_transfer
    question: 해외 송금도 할 수 있나요
    answer: 해외 송금은 영업점과 앱에서 가능하며, 수수료와 도착 시점은 송금 국가에 따라 달라집니다.
    paraphrases: [외국으로 돈 보내고 싶어요, 해외로 송금하려면 어떻게 해요, 해외 송금 수수료가 궁금해요]
    asr_variants: [해외 송그음도 할 수 있나여, 해외송금 수수료 가 궁금해요]
  - id: bank.faq.loan_repay
    question: 대출을 미리 갚고 싶어요
    answer: 대출은 앱의 대출 메뉴에서 일부 또는 전액을 상환하실 수 있고, 조건에 따라 중도상환 수수료가 있을 수 있습니다.
    paraphrases: [대출 중도 상환하고 싶어요, 대출금 먼저 갚으면 수수료 있나요, 남은 대출 한 번에 갚는 방법 알려주세요]
    asr_variants: [대출을 미리 갑고 싶어요, 대출 중도상환 수수료 있나여]
