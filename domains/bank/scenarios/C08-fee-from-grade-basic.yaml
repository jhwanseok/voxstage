id: bank.C08.002
domain: bank
capability: C08
title: "같은 질문이라도 등급이 다르면 API 결과가 달라져 답변이 달라진다 (일반: 500원)"
tags: [attribute, api]
setup:
  customer: {grade: basic}
turns:
  - user: {kind: utterance, text: 오십만 원 이체하면 수수료가 얼마예요}
    expect:
      slots: {amount: "500000"}
      tool_calls:
        - {name: get_transfer_fee, args: {amount: "500000", grade: basic}}
      reply_contains_any: [500원, 오백 원]
