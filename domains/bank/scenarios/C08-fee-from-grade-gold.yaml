id: bank.C08.001
domain: bank
capability: C08
title: "고객 등급(속성)과 API 결과를 조합해 이체 수수료를 안내한다 (골드: 면제)"
tags: [attribute, api]
setup:
  customer: {grade: gold}
turns:
  - user: {kind: utterance, text: 오십만 원 이체하면 수수료가 얼마예요}
    expect:
      slots: {amount: "500000"}
      tool_calls:
        - {name: get_transfer_fee, args: {amount: "500000", grade: gold}}
      reply_contains_any: [수수료는 없, 면제, 0원, 무료]
