id: bank.C09.002
domain: bank
capability: C09
title: 조건에 해당하지 않는 상품(입출금 통장)에는 예금 고지 문구가 나가면 안 된다
tags: [verbatim, compliance, negative]
turns:
  - user: {kind: utterance, text: 입출금 통장 새로 만들고 싶어요}
    expect:
      flow: checking_signup
      reply_not_contains:
        - 만기 전에 해지하면 약정한 이자보다 낮은 이자가 적용될 수 있습니다.
