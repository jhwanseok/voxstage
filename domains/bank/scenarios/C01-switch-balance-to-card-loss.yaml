id: bank.C01.001
domain: bank
capability: C01
title: 잔액 조회 도중 카드 분실을 말하면 분실 신고 흐름으로 전환한다
tags: [switch, priority]
turns:
  - user: {kind: utterance, text: 잔액 조회하고 싶어요}
    expect:
      flow: balance_inquiry
      reply_contains_any: [계좌, 어느]
  - user: {kind: utterance, text: 아 잠깐만요 카드를 잃어버렸어요}
    expect:
      flow: card_loss
      reply_contains_any: [분실, 정지]
variants:
  - turn: 1
    texts: [그보다 체크카드를 분실했는데요, 잔액은 나중에 보고 카드부터 막아주세요, 카드가 없어졌어요]
