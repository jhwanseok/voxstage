id: bank.C14.001
lang: en
domain: bank
capability: C14
title: "The person who books is not the person who visits: the visitor's number goes to the API, not the booker's"
tags: [roles, binding]
turns:
  - user: {kind: utterance, text: I'd like to book a branch visit}
    expect:
      flow: book_visit
      reply_contains_any: [phone]
  - user: {kind: dtmf, digits: "5580"}
    expect:
      slots: {booker.phone_last4: "5580"}
      reply_contains_any: [you]
  - user: {kind: utterance, text: "No"}
    expect:
      tool_calls: []
      reply_contains_any: [visitor]
  - user: {kind: dtmf, digits: "7310"}
    expect:
      tool_calls:
        - {name: book_visit, args: {booker_phone: "5580", visitor_phone: "7310"}}
      reply_contains: ["7310", BV1001]
