id: bank.C11.002
lang: en
domain: bank
capability: C11
title: "A wrong PIN keeps the information locked and nothing about the account is revealed"
tags: [verification, gate, negative]
setup:
  customer: {account_last4: "4821"}
turns:
  - user: {kind: utterance, text: What's my balance}
    expect:
      tool_calls: []
  - user: {kind: dtmf, digits: "1111"}
    expect:
      tool_calls:
        - {name: verify_identity, args: {account_last4: "4821", pin: "1111"}, error: invalid_credentials}
      reply_contains_any: [incorrect, try again, couldn't verify]
      reply_not_contains: ["$", dollars, "1,250"]
