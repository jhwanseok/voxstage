id: bank.C08.002
lang: en
domain: bank
capability: C08
title: "The same question gets a different answer because the API result differs by grade (basic: 5 dollars)"
tags: [attribute, api]
setup:
  customer: {grade: basic}
turns:
  - user: {kind: utterance, text: What is the fee if I transfer five hundred dollars}
    expect:
      slots: {amount: "500"}
      tool_calls:
        - {name: get_transfer_fee, args: {amount: "500", grade: basic}}
      reply_contains_any: ["$5", five dollars]
