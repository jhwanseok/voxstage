id: bank.C13.003
lang: en
domain: bank
capability: C13
title: "The account digits are corrected while the PIN is asked"
tags: [interaction, R13xR9]
turns:
  - user: {kind: utterance, text: What's my balance}
    expect:
      flow: balance_inquiry
      reply_contains_any: [last four digits]
  - user: {kind: dtmf, digits: "4812"}
    expect:
      slots: {account_last4: "4812"}
      tool_calls: []
      reply_contains_any: [PIN]
  - user: {kind: utterance, text: No sorry the account is 4821}
    expect:
      slots: {account_last4: "4821"}
      tool_calls: []
      reply_contains_any: [PIN]
  - user: {kind: dtmf, digits: "2468"}
    expect:
      tool_calls:
        - {name: verify_identity, args: {account_last4: "4821", pin: "2468"}}
        - {name: get_balance, args: {account_last4: "4821"}}
      reply_contains_any: [balance, "1,250"]
