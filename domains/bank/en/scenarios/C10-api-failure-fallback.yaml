id: bank.C10.001
lang: en
domain: bank
capability: C10
title: "When the balance API times out, the reply says so and offers a next step instead of inventing a number"
tags: [api_failure, fallback]
turns:
  - user: {kind: button, button_id: menu_balance}
    expect:
      flow: balance_inquiry
  - user: {kind: dtmf, digits: "0000"}
    expect:
      tool_calls:
        - {name: get_balance, args: {account_last4: "0000"}, error: timeout}
      reply_contains_any: [try again, unable, couldn't]
      reply_not_contains: ["$", dollars]
