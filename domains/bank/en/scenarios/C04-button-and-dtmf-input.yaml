id: bank.C04.001
lang: en
domain: bank
capability: C04
title: "The menu choice arrives as a button press and the last four digits as keypad input (no recognition error)"
tags: [dtmf, button]
turns:
  - user: {kind: button, button_id: menu_balance}
    expect:
      flow: balance_inquiry
      reply_contains: [last four digits]
  - user: {kind: dtmf, digits: "4821"}
    expect:
      slots: {account_last4: "4821"}
      tool_calls: []   # the identity check comes before the lookup (decision R13-3)
      reply_contains_any: [PIN]
  - user: {kind: dtmf, digits: "2468"}
    expect:
      tool_calls:
        - {name: verify_identity, args: {account_last4: "4821", pin: "2468"}}
        - {name: get_balance, args: {account_last4: "4821"}}
      reply_contains_any: [balance, "1,250", twelve hundred]
