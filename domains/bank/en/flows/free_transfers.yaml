# Policy value spoken from the request's policy (R14).
id: free_transfers
triggers: {all_of: [[free], [transfer, transfers]], any_of: [many, month, monthly, each, per, number], priority: 1}
start: say_it
nodes:
  say_it: {type: say, text: "You get {policy.free_transfers_per_month | count} free transfers each month.", next: done}
  done: {type: end}
