id: bank.C14.003
lang: ko
domain: bank
capability: C14
title: "본인 확인으로 증명된 계좌를 조회에 쓰고, 다시 묻지 않는다"
tags: [roles, binding, verification]
turns:
  - user: {kind: utterance, text: 내 영업점 방문 예약이 언제예요}
    expect:
      flow: identity_check
      tool_calls: []
      reply_contains_any: [계좌]
  - user: {kind: dtmf, digits: "4821"}
    expect:
      reply_contains_any: [PIN, 비밀번호]
  - user: {kind: dtmf, digits: "2468"}
    expect:
      tool_calls:
        - {name: verify_identity, args: {account_last4: "4821", pin: "2468"}}
        - {name: get_visit, args: {account_last4: "4821"}}
      reply_contains: [Downtown, BV0420]
