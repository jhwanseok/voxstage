id: bank.C11.001
lang: ko
domain: bank
capability: C11
title: "PIN 확인을 통과하기 전에는 계좌 정보를 알려 주지 않고, 통과하면 안내한다"
tags: [verification, gate]
setup:
  customer: {account_last4: "4821"}
turns:
  - user: {kind: utterance, text: 내 잔액이 얼마예요}
    expect:
      tool_calls: []
      reply_contains_any: [본인, 인증, 비밀번호, PIN]
  - user: {kind: dtmf, digits: "2468"}
    expect:
      tool_calls:
        - {name: verify_identity, args: {account_last4: "4821", pin: "2468"}}
        - {name: get_balance, args: {account_last4: "4821"}}
      reply_contains_any: [잔액, "1,250", 천이백오십]
