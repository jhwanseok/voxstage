id: bank.C11.002
lang: ko
domain: bank
capability: C11
title: "PIN이 틀리면 정보는 잠긴 채로 유지되고 계좌에 관한 내용은 일절 알려 주지 않는다"
tags: [verification, gate, negative]
setup:
  customer: {account_last4: "4821"}
turns:
  - user: {kind: utterance, text: 내 잔액이 얼마예요}
    expect:
      tool_calls: []
  - user: {kind: dtmf, digits: "1111"}
    expect:
      tool_calls:
        - {name: verify_identity, args: {account_last4: "4821", pin: "1111"}, error: invalid_credentials}
      reply_contains_any: [일치하지, 올바르지, 다시, 확인할 수 없]
      reply_not_contains: ["$", 달러, "1,250"]
