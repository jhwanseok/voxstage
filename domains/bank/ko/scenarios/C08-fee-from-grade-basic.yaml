id: bank.C08.002
lang: ko
domain: bank
capability: C08
title: "같은 질문이라도 API 결과가 등급별로 달라 답이 다르다 (일반 등급: 5달러)"
tags: [attribute, api]
setup:
  customer: {grade: basic}
turns:
  - user: {kind: utterance, text: 오백 달러 이체하면 수수료가 얼마예요}
    expect:
      slots: {amount: "500"}
      tool_calls:
        - {name: get_transfer_fee, args: {amount: "500", grade: basic}}
      reply_contains_any: ["5달러", "5 달러", 오 달러, "$5"]
