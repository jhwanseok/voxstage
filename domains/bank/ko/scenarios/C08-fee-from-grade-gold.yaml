id: bank.C08.001
lang: ko
domain: bank
capability: C08
title: "고객 등급(속성)과 API 결과로 이체 수수료를 답한다 (골드: 수수료 없음)"
tags: [attribute, api]
setup:
  customer: {grade: gold}
turns:
  - user: {kind: utterance, text: 오백 달러 이체하면 수수료가 얼마예요}
    expect:
      slots: {amount: "500"}
      tool_calls:
        - {name: get_transfer_fee, args: {amount: "500", grade: gold}}
      reply_contains_any: [무료, 면제, 없습니다, "0달러"]
