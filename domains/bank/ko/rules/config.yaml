# 일치하는 FAQ 룰이 없을 때의 동작. 연속 max_misses번 실패하면 상담사 연결(on_exceed: handoff)
# 또는 통화 종료(on_exceed: end_call)를 한다. 일치하면 횟수는 0으로 돌아간다.
fallback:
  max_misses: 3
  on_exceed: handoff

# Unusable answer at an ask: re-prompt up to max_reprompts times, then hand off (or end the call).
ask:
  max_reprompts: 2
  on_exceed: handoff

# A switch to another flow sets the running one aside (R6); at most max_parked are kept, the oldest is dropped (R7-3).
switch:
  max_parked: 2

# Corrections of one read-back slot before the caller is handed off (R9-3).
correction:
  max_corrections: 2
  on_exceed: handoff

# Failed identity checks before the call is locked and handed off (R13-2); a flow may set its own
# `verification: {max_attempts: N}`.
verification:
  max_attempts: 3
  on_exceed: handoff

# Tool failures (R12-4, R12-5): system errors (timeout, after the retry) over the call before a hand-off,
# and how slow an answer may be before it counts as a timeout.
tools:
  max_failures: 2
  on_exceed: handoff
  timeout_ms: 5000
