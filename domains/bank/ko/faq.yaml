# 가상 은행의 합성 FAQ. 이 프로젝트를 위해 처음부터 작성했습니다.
# `answer`는 그대로 나가는 답변입니다. `asr_variants`는 사람이 직접 쓴 그럴듯한 인식 오류(발음 유사,
# 띄어쓰기, 조사 탈락)이며 실제 ASR 출력이 아닙니다. 실제 잡음은 이후 오디오 모드에서 다룹니다.
lang: ko
entries:
  - id: bank.faq.hours
    question: 영업시간이 어떻게 되나요
    answer: 영업점은 평일 오전 9시부터 오후 4시까지 운영하며, 주말과 공휴일에는 문을 닫습니다.
    paraphrases: [몇 시까지 해요, 지점 언제 가면 돼요, 토요일에도 문 열어요]
    asr_variants: [영업 시가 어떻게 되나여, 여업시간이 어떻게 되나요 네]
  - id: bank.faq.card_loss
    question: 체크카드를 잃어버렸는데 어떻게 해야 하나요
    answer: 앱이나 고객센터 전화로 분실 신고를 하실 수 있으며, 신고하시는 즉시 카드가 정지됩니다.
    paraphrases: [카드 잃어버렸어요 어떡하죠, 체크카드가 없어졌는데 막을 수 있나요, 누가 제 카드를 훔쳐간 것 같아요]
    asr_variants: [체크 카드를 이러버렸는데 어떻게 해야 하나요, 카드 이러버렸어요 어떠카죠]
  - id: bank.faq.transfer_limit
    question: 이체 한도가 얼마예요
    answer: 이체 한도는 계좌 종류와 인증 방법에 따라 다르며, 앱의 한도 메뉴에서 확인하고 변경하실 수 있습니다.
    paraphrases: [하루에 얼마까지 보낼 수 있어요, 이체 한도 좀 올리고 싶어요, 송금 가능한 금액에 제한이 있나요]
    asr_variants: [이체 한도가 얼마에요 네, 하루에 얼마까지 보낼 수 이써요]
  - id: bank.faq.password_locked
    question: 비밀번호를 여러 번 틀려서 잠겼어요
    answer: 비밀번호 오류로 계정이 잠긴 경우, 본인 확인을 거친 뒤 앱에서 비밀번호를 재설정하실 수 있습니다.
    paraphrases: [비번을 잘못 쳐서 로그인이 안 돼요, 인터넷뱅킹 잠금은 어떻게 풀어요, 계정이 잠겨서 못 들어가요]
    asr_variants: [비밀 번호를 여러 번 틀려서 잠겨써요, 비미번호 여러번 틀려서 잠겼어요 요]
  - id: bank.faq.statement_copy
    question: 거래내역서는 어떻게 받나요
    answer: 앱의 문서함에서 거래내역서를 내려받으실 수 있고, 신분증을 가지고 영업점을 방문하시면 출력본도 받으실 수 있습니다.
    paraphrases: [통장 거래 내역은 어디서 볼 수 있어요, 지난달 거래내역서가 필요해요, 종이로 된 내역서도 받을 수 있나요]
    asr_variants: [거래 내역서는 어떻게 바나요, 지난달 거래내여서가 필요해여]
  - id: bank.faq.recurring_payment
    question: 자동이체는 어떻게 변경하거나 해지하나요
    answer: 앱의 자동이체 메뉴에서 금액이나 날짜를 변경하거나 해지하실 수 있습니다.
    paraphrases: [자동이체 그만하고 싶어요, 자동이체 금액을 바꾸려면 어떻게 해요, 이체되는 날짜를 옮길 수 있나요]
    asr_variants: [자동 이체는 어떻게 변경하거나 해지하나여, 자동이체 그만하고 시퍼요 요]
  - id: bank.faq.international_transfer
    question: 해외로 송금할 수 있나요
    answer: 해외송금은 영업점과 앱에서 가능하며, 수수료와 도착 시간은 받는 나라에 따라 다릅니다.
    paraphrases: [외국으로 돈을 보내고 싶어요, 다른 나라에 송금하려면 어떻게 해요, 해외송금 수수료는 얼마예요]
    asr_variants: [해외로 송그미 가능한가여, 해외 송금 수수료는 얼마에요 요]
  - id: bank.faq.loan_payoff
    question: 대출을 미리 갚을 수 있나요
    answer: 앱의 대출 메뉴에서 일부 또는 전액을 미리 갚으실 수 있으며, 약정 조건에 따라 중도상환수수료가 부과될 수 있습니다.
    paraphrases: [대출금을 만기 전에 갚고 싶어요, 대출 일찍 갚으면 수수료 있어요, 남은 대출을 한 번에 다 갚으려면 어떻게 해요]
    asr_variants: [대출을 미리 가플 수 이나요, 대출 미리 갑을 수 있나여]
