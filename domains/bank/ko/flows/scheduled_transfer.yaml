# 예약 이체 (R11-3): 말로 한 금액과 날짜를 시나리오 시계 기준으로 읽고, 확인 후 예약한다. 영어 쌍둥이와 노드 구조가 같다.
id: scheduled_transfer
triggers: {all_of: [[예약]], any_of: [이체, 송금, 보내], none_of: [어떻, 방법, 수수료]}
captures: {amount: {extractor: number}, date: {extractor: date}, to_account: {extractor: choice, choices: {저축: savings, 입출금: checking}}}
start: ask_amount
nodes:
  ask_amount: {type: ask, slot: amount, prompt: "얼마를 이체하실 건가요? 금액을 말씀해 주세요.", extractor: number, next: ask_date}
  ask_date: {type: ask, slot: date, prompt: "언제 보낼까요?", extractor: date, next: ask_to}
  ask_to: {type: ask, slot: to_account, prompt: "어느 계좌로 보내시나요? 저축 계좌 또는 입출금 계좌라고 말씀해 주세요.", extractor: choice, choices: {저축: savings, 입출금: checking}, next: confirm}
  confirm: {type: confirm, prompt: "{date | date}에 {amount | money('USD')}를 {'저축' if to_account == 'savings' else '입출금'} 계좌로 보낼까요?", on_yes: book, on_no: done}
  book: {type: call, tool: schedule_transfer, args: {amount: "{amount}", date: "{date}", to_account: "{to_account}"}, on_ok: say_done, on_error: say_fail}
  say_done: {type: say, text: "{date | date}에 보내도록 예약했습니다. 접수번호는 {result.reference}입니다.", next: done}
  say_fail: {type: say, text: "지금은 예약 이체를 처리할 수 없어요. 잠시 후 다시 시도해 주세요.", next: done}
  done: {type: end}
