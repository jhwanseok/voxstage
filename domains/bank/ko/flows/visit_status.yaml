# 발신자 본인의 예약 조회 (R16a, ADR 0014): 계좌는 본인 확인이 채운 세션 역할 `caller`에서 가져오므로 다시 묻지 않는다.
id: visit_status
triggers: {all_of: [[예약], [언제, 확인, 조회]], priority: 1}
start: lookup
nodes:
  lookup:
    type: call
    tool: get_visit
    bind:
      account_last4: {role: caller, field: account_last4}
    on_ok: say_visit
    on_error: say_none
  say_visit: {type: say, text: "{result.branch} 지점 방문 예약은 내일 오전 열 시입니다. 예약 번호는 {result.reference}입니다.", next: done}
  say_none: {type: say, text: "고객님의 예약을 찾을 수 없습니다.", next: done}
  done: {type: end}
