# Fake backend API for the bank domain. Answers depend only on the arguments (see docs/decisions/0004).
# Language-independent, so it is shared by every language of the domain.
tools:
  get_balance:
    retry: 1                    # a timeout is tried once more (R12-1)
    requires: verified          # caller must pass verify_identity first (R13-1)
    params: [account_last4]
    rules:
      - when: {account_last4: "0000"}
        error: timeout            # used by the API-failure case (C10)
      - when: {account_last4: "4821"}
        return: {balance: 1250, currency: USD}
      - when: {account_last4: "7310"}
        return: {balance: 3000, currency: USD}
    default:
      error: not_found
  get_transfer_fee:
    retry: 1                    # a timeout is tried once more (R12-1)
    params: [amount, grade]
    rules:
      - when: {grade: gold}
        return: {fee: 0, currency: USD}
      - when: {grade: basic}
        return: {fee: 5, currency: USD}
    default:
      error: not_found
  make_transfer:
    params: [amount, to_account]
    risky: true           # moves money: a flow must confirm before calling it (R7-12)
    rules: []
    default:              # every transfer is accepted (R7-6); no failure rule yet
      return: {reference: TR1001}
  schedule_transfer:
    params: [amount, date, to_account]
    risky: true           # moves money later: confirm first (R7-12, R11-3)
    rules: []
    default:
      return: {reference: TS1001}
  verify_identity:
    verifies: true
    params: [account_last4, pin]
    rules:
      - when: {account_last4: "4821", pin: "2468"}
        return: {verified: true}
      - when: {account_last4: "0000", pin: "2468"}
        return: {verified: true}   # passes, so the C10 timeout comes after the check (R13-3)
    default:
      error: invalid_credentials
  book_visit:
    params: [booker_phone, visitor_phone]
    rules: []
    default:
      return: {reference: BV1001}
  get_visit:
    requires: verified          # the caller's own booking: after the identity check (R13-1)
    params: [account_last4]
    rules:
      - when: {account_last4: "4821"}
        return: {reference: BV0420, branch: Downtown}
    default:
      error: not_found
