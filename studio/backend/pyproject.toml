[project]
name = "voxstage-studio-backend"
version = "0.0.1"
description = "Management console backend for voxstage (reference implementation)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pyyaml",
  "pydantic>=2",
  "python-multipart",
]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["studio_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
